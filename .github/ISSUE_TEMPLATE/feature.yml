name: 功能建议
description: 想让校招投递控制台多做一件事
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 描述你求职流程里遇到的具体麻烦,越具体越好
      placeholder: 例如:每次面完都要手动把进度同步给一起秋招的同学……
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的做法
      description: 你希望工具怎么帮你;如果不确定,写清楚目标也行
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法(可选)
      description: 现在你是怎么凑合的
  - type: checkboxes
    id: scope
    attributes:
      label: 确认
      options:
        - label: 我已阅读 README 的「使用红线」——理解批量采集/高频请求类需求不会被接受
