# 发布构建：推 v* 标签或手动触发（workflow_dispatch），自动打 Mac + Windows 安装包并发布 GitHub Release。
# 产物：campus-apply-tracker-full-{Mac,Windows}-v<版本>.zip + SHA256SUMS.txt
# 说明：Windows 包本就设计为在 Mac 上打包（纯 JS node_modules 跨平台，安装时自动下载便携 Node），
#       因此单个 macOS job 即可产出双平台安装包；tracker 前端来自第二个公开仓库，CI 里一并 checkout。
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v 前缀，如 1.1.2）'
        required: true
        type: string
permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: checkout 台账前端
        uses: actions/checkout@v4
        with:
          repository: Tian-Zhen-Yin/campus-recruitment-tracker
          path: tracker-repo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装依赖（Windows 包内嵌 node_modules）
        run: npm install --no-fund --no-audit --loglevel=error
      - name: 计算版本号
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
            echo "TAG=v${{ inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          fi
          # 插件包名跟插件自身 manifest 版本走：控制台发版但插件没改时，主页直链(版本钉死)不断链
          echo "PLUGIN_VERSION=$(node -p "require('./plugin/manifest.json').version")" >> "$GITHUB_ENV"
      - name: 打包 Mac + Windows + 收录插件
        run: |
          export TRACKER_REPO="$GITHUB_WORKSPACE/tracker-repo"
          bash scripts/pack-offline-full.sh "$VERSION"
          bash scripts/pack-full-windows.sh "$VERSION"
          (cd plugin && zip -qr "$GITHUB_WORKSPACE/dist/job-capture-assistant-v$PLUGIN_VERSION.zip" .)
          cd dist
          cp "校招投递管理-完整版-Mac-v$VERSION.zip" "campus-apply-tracker-full-Mac-v$VERSION.zip"
          cp "校招投递管理-完整版-Windows-v$VERSION.zip" "campus-apply-tracker-full-Windows-v$VERSION.zip"
          shasum -a 256 campus-apply-tracker-full-*.zip job-capture-assistant-*.zip > SHA256SUMS.txt
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            gh release create "$TAG" --prerelease --title "v$VERSION（CI 预发布）" --generate-notes || true
          else
            gh release create "$TAG" --verify-tag --title "v$VERSION — 校招投递控制台" --generate-notes || true
          fi
          gh release upload "$TAG" campus-apply-tracker-full-Mac-v*.zip campus-apply-tracker-full-Windows-v*.zip job-capture-assistant-v*.zip SHA256SUMS.txt --clobber
